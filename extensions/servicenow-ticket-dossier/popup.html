<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RiskRegister Browser Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>RiskRegister Browser Sync</h1>
    <p id="status">Checking status…</p>
    <dl id="details" hidden>
      <div><dt>Type</dt><dd id="kind">—</dd></div>
      <div><dt>Source</dt><dd id="source">—</dd></div>
      <div><dt>Target</dt><dd id="target">—</dd></div>
      <div><dt>Expires</dt><dd id="expires">—</dd></div>
    </dl>
    <p id="error" class="error" hidden></p>
    <button type="button" id="clear" hidden>Clear pending sync</button>
    <p class="help">
      Prepare a sync in SharePoint Catalog or Ticket Dossier. The extension
      starts it automatically when the matching browser tab opens.
    </p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
